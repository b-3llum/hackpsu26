<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Consent Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><img class="brand-logo" src="/logo.png" width="32" height="32" alt="">Consent Receipts</a>
      <a class="back-link" href="/"><span aria-hidden="true">&larr;</span> Back to home</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="card auth-card">
      <h1>Log in</h1>
      <p class="lede" id="lede">Welcome back.</p>

      <div class="alert alert-error" role="alert" id="form-error" hidden></div>

      <div id="google-block" hidden>
        <a class="btn btn-secondary btn-block btn-google" id="google" href="/auth/google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9Z"/></svg>Continue with Google</a>
        <p class="hint" id="google-terms" hidden>By continuing with Google you accept the <a href="/legal/terms">Terms of Service</a> and <a href="/legal/privacy">Privacy Policy</a>.</p>
        <div class="divider">or</div>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap has-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" data-toggle-pass="password" aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submit" disabled>Log in</button>
      </form>

      <div class="auth-foot">New here? <a href="/signup" id="signup-link">Create an account</a></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <nav class="footer-links" aria-label="Legal">
        <a href="/legal/terms">Terms of Service</a>
        <a href="/legal/privacy">Privacy Policy</a>
      </nav>
      <div>&copy; 2026 Consent Receipts. Built at HackPSU Fall 26.</div>
    </div>
  </footer>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
